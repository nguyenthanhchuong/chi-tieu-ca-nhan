<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chọn màu - Sổ Chi Tiêu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #eceff1; color: #26282b; padding: 16px; font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { font-size: 19px; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }

  .pa { margin-bottom: 26px; }
  .pa-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .pa-ten { font-size: 15px; font-weight: 700; }
  .pa-ma { font-size: 11px; color: #6b7280; }
  .pa-mota { font-size: 12.5px; color: #6b7280; margin-bottom: 10px; }

  /* Khung mô phỏng app */
  .app { border-radius: 14px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  .top { padding: 14px 16px; color: #fff; }
  .top small { display: block; font-size: 11.5px; opacity: .85; }
  .top b { font-size: 22px; letter-spacing: -.02em; }
  .than { padding: 12px; }

  .the { border-radius: 11px; padding: 11px 12px; margin-bottom: 8px; }
  .the-top { display: flex; justify-content: space-between; align-items: baseline; }
  .the-ten { font-size: 13.5px; font-weight: 700; }
  .the-so { font-size: 14px; font-weight: 700; }
  .the-phu { font-size: 11px; margin-bottom: 6px; }
  .thanh { height: 6px; border-radius: 3px; overflow: hidden; }
  .thanh i { display: block; height: 100%; border-radius: 3px; }

  .nut { width: 100%; border: none; border-radius: 10px; padding: 11px;
         font-family: inherit; font-size: 14px; font-weight: 700; color: #fff; margin-top: 4px; }

  .chip-hang { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; border-radius: 16px; padding: 6px 11px; }

  .bd { display: flex; align-items: flex-end; gap: 7px; height: 74px;
        padding: 8px 10px 0; border-radius: 11px; margin-bottom: 8px; }
  .cum { flex: 1; display: flex; gap: 2px; align-items: flex-end; height: 100%; }
  .cum i { flex: 1; border-radius: 2px 2px 0 0; display: block; }

  .dong { display: flex; justify-content: space-between; padding: 7px 12px;
          border-radius: 9px; font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Chọn màu cho Sổ Chi Tiêu</h1>
  <p class="sub">Bốn phương án trên đúng các thành phần thật của app. Anh xem trên điện thoại
  cho đúng cảm giác dùng thật, rồi báo em chọn số mấy.</p>
  <div id="ds"></div>
</div>

<script>
const CAC_MAU = [
  {
    ten: "1. Hiện tại",
    mota: "Bản đang chạy. Hồng raspberry đậm, Thu màu xanh lá.",
    bg: "#fdf1f5", card: "#ffffff", text: "#33212a", muted: "#8a6b76",
    line: "#f4dde6", accent: "#bf4574", thu: "#1f8a4c"
  },
  {
    ten: "2. Hồng đào",
    mota: "Ngả cam đất, ấm và dịu hơn. Hợp nếu anh thấy bản hiện tại hơi chói.",
    bg: "#fdf3f0", card: "#ffffff", text: "#3a2a28", muted: "#8d7069",
    line: "#f6e2dc", accent: "#b85252", thu: "#2f7d5f"
  },
  {
    ten: "3. Hồng + xanh ngọc",
    mota: "Giữ nguyên hồng, đổi Thu sang xanh ngọc. Phân biệt thu/chi rõ nhất, kể cả với người mù màu đỏ-lục.",
    bg: "#fdf1f5", card: "#ffffff", text: "#33212a", muted: "#8a6b76",
    line: "#f4dde6", accent: "#bf4574", thu: "#0d7d72"
  },
  {
    ten: "4. Hồng sương + oải hương",
    mota: "Ngả tím, nhẹ và trầm nhất. Nhìn êm mắt khi dùng buổi tối.",
    bg: "#faf2f7", card: "#ffffff", text: "#312433", muted: "#847089",
    line: "#efe0ee", accent: "#a4527e", thu: "#4a7c6f"
  }
];

// Kiểm tra tương phản chữ trắng trên màu neo, theo chuẩn WCAG.
function doSang(hex) {
  const n = parseInt(hex.slice(1), 16);
  const rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  const lin = c => { c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); };
  return .2126 * lin(rgb[0]) + .7152 * lin(rgb[1]) + .0722 * lin(rgb[2]);
}
const tuongPhan = hex => Math.round((1.05 / (doSang(hex) + .05)) * 100) / 100;

document.getElementById("ds").innerHTML = CAC_MAU.map(m => `
  <div class="pa">
    <div class="pa-head">
      <span class="pa-ten">${m.ten}</span>
      <span class="pa-ma">chữ trắng trên nút: ${tuongPhan(m.accent)}:1</span>
    </div>
    <p class="pa-mota">${m.mota}</p>

    <div class="app" style="background:${m.bg}">
      <div class="top" style="background:${m.accent}">
        <small>Chi tháng 8/2026</small><b>2.450.000 đ</b>
      </div>

      <div class="than">
        <div class="chip-hang">
          <span class="chip" style="background:${m.accent};color:#fff;font-weight:600">Ăn uống</span>
          <span class="chip" style="background:${m.bg};color:${m.muted};border:1px solid ${m.line}">Đi lại</span>
          <span class="chip" style="background:${m.bg};color:${m.muted};border:1px solid ${m.line}">Hoá đơn</span>
        </div>

        <div class="the" style="background:${m.card}">
          <div class="the-top">
            <span class="the-ten" style="color:${m.text}">Thiết yếu</span>
            <span class="the-so" style="color:${m.text}">7.697.500 đ</span>
          </div>
          <div class="the-phu" style="color:${m.muted}">Vào 8.000.000 đ · đã dùng 302.500 đ</div>
          <div class="thanh" style="background:${m.bg}">
            <i style="width:38%;background:${m.accent}"></i>
          </div>
        </div>

        <div class="bd" style="background:${m.card}">
          ${[[55,20],[70,35],[40,28],[85,45],[30,18],[95,52]].map(([a,b]) => `
            <span class="cum">
              <i style="height:${a}%;background:${m.thu}"></i>
              <i style="height:${b}%;background:${m.accent}"></i>
            </span>`).join("")}
        </div>

        <div class="dong" style="background:${m.card};margin-bottom:8px">
          <span style="color:${m.text};font-weight:600">Lương</span>
          <span style="color:${m.thu};font-weight:700">+15.000.000 đ</span>
        </div>
        <div class="dong" style="background:${m.card}">
          <span style="color:${m.text};font-weight:600">Chợ/Siêu thị</span>
          <span style="color:${m.accent};font-weight:700">−42.500 đ</span>
        </div>

        <button class="nut" style="background:${m.accent}">Lưu khoản chi</button>
      </div>
    </div>
  </div>`).join("");
</script>
</body>
</html>
