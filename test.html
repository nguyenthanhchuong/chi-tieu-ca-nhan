  <h1>Test - Sổ Chi Tiêu</h1>
  <p class="sub">Kiểm tra phần tính toán trong <code>logic.js</code>. Mở trang này là tự chạy.</p>

<script>
function chayToanBo() {

// ===== Khung test tối giản =====
const ketQua = [];
let nhomHienTai = "";

function nhom(ten) { nhomHienTai = ten; }

function test(ten, fn) {
  try {
    fn();
    ketQua.push({ nhom: nhomHienTai, ten, dat: true });
  } catch (e) {
    ketQua.push({ nhom: nhomHienTai, ten, dat: false, loi: e.message });
  }
}

function bang(thuc, mong, ghiChu) {
  const a = JSON.stringify(thuc), b = JSON.stringify(mong);
  if (a !== b) {
    throw new Error(`${ghiChu ? ghiChu + ": " : ""}mong ${b}, nhận ${a}`);
  }
}

const N = s => new Date(s + "T00:00:00");   // ngày cố định, không lệ thuộc múi giờ

// ===================================================================
nhom("Đọc số tiền người dùng gõ");

test("bỏ dấu chấm phân cách", () => bang(Logic.parseAmount("50.000"), 50000));
test("số nhiều nhóm", () => bang(Logic.parseAmount("1.234.567"), 1234567));
test("chuỗi rỗng thành 0", () => bang(Logic.parseAmount(""), 0));
test("chữ cái thành 0", () => bang(Logic.parseAmount("abc"), 0));
test("null thành 0", () => bang(Logic.parseAmount(null), 0));
test("lẫn chữ và số thì lấy phần số", () => bang(Logic.parseAmount("50k000"), 50000));

nhom("Hiển thị số tiền");
test("chấm phân cách nghìn", () => bang(Logic.formatMoney(1234567), "1.234.567"));
test("số 0", () => bang(Logic.formatMoney(0), "0"));
test("làm tròn số lẻ", () => bang(Logic.formatMoney(1000.6), "1.001"));

// ===================================================================
nhom("Khoảng ngày theo TUẦN (tuần bắt đầu thứ Hai)");

test("giữa tuần: thứ Tư 12/08/2026", () => {
  const { dau, cuoi } = Logic.khoangKy("tuan", 0, N("2026-08-12"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2026-08-10", "2026-08-16"]);
});

test("CHỦ NHẬT vẫn thuộc tuần bắt đầu thứ Hai trước đó", () => {
  const { dau, cuoi } = Logic.khoangKy("tuan", 0, N("2026-08-16"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2026-08-10", "2026-08-16"]);
});

test("chính thứ Hai là ngày đầu tuần", () => {
  const { dau } = Logic.khoangKy("tuan", 0, N("2026-08-10"));
  bang(Logic.ngayKey(dau), "2026-08-10");
});

test("lùi 1 tuần", () => {
  const { dau, cuoi } = Logic.khoangKy("tuan", -1, N("2026-08-12"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2026-08-03", "2026-08-09"]);
});

test("tuần vắt qua năm mới", () => {
  const { dau, cuoi } = Logic.khoangKy("tuan", 0, N("2027-01-01"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2026-12-28", "2027-01-03"]);
});

// ===================================================================
nhom("Khoảng ngày theo THÁNG");

test("tháng đủ 31 ngày", () => {
  const { dau, cuoi } = Logic.khoangKy("thang", 0, N("2026-08-12"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2026-08-01", "2026-08-31"]);
});

test("tháng 2 năm thường có 28 ngày", () => {
  const { cuoi } = Logic.khoangKy("thang", 0, N("2026-02-10"));
  bang(Logic.ngayKey(cuoi), "2026-02-28");
});

test("tháng 2 năm nhuận có 29 ngày", () => {
  const { cuoi } = Logic.khoangKy("thang", 0, N("2028-02-10"));
  bang(Logic.ngayKey(cuoi), "2028-02-29");
});

test("lùi từ tháng 1 về tháng 12 năm trước", () => {
  const { dau, cuoi } = Logic.khoangKy("thang", -1, N("2026-01-15"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2025-12-01", "2025-12-31"]);
});

// ===================================================================
nhom("Khoảng ngày theo QUÝ");

test("tháng 8 thuộc quý 3", () => {
  const { dau, cuoi } = Logic.khoangKy("quy", 0, N("2026-08-12"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2026-07-01", "2026-09-30"]);
});

test("tháng 1 thuộc quý 1", () => {
  const { dau, cuoi } = Logic.khoangKy("quy", 0, N("2026-01-05"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2026-01-01", "2026-03-31"]);
});

test("tháng 12 thuộc quý 4", () => {
  const { dau, cuoi } = Logic.khoangKy("quy", 0, N("2026-12-31"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2026-10-01", "2026-12-31"]);
});

test("lùi từ quý 1 về quý 4 năm trước", () => {
  const { dau, cuoi } = Logic.khoangKy("quy", -1, N("2026-02-10"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2025-10-01", "2025-12-31"]);
});

// ===================================================================
nhom("Khoảng ngày theo NĂM");

test("cả năm", () => {
  const { dau, cuoi } = Logic.khoangKy("nam", 0, N("2026-08-12"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2026-01-01", "2026-12-31"]);
});

test("lùi 1 năm", () => {
  const { dau, cuoi } = Logic.khoangKy("nam", -1, N("2026-08-12"));
  bang([Logic.ngayKey(dau), Logic.ngayKey(cuoi)], ["2025-01-01", "2025-12-31"]);
});

// ===================================================================
nhom("Nhãn hiển thị của kỳ");

test("nhãn tuần", () => {
  const { dau, cuoi } = Logic.khoangKy("tuan", 0, N("2026-08-12"));
  bang(Logic.nhanKy("tuan", dau, cuoi), "10/08 – 16/08/2026");
});
test("nhãn tháng", () => {
  const { dau, cuoi } = Logic.khoangKy("thang", 0, N("2026-08-12"));
  bang(Logic.nhanKy("thang", dau, cuoi), "Tháng 8/2026");
});
test("nhãn quý", () => {
  const { dau, cuoi } = Logic.khoangKy("quy", 0, N("2026-08-12"));
  bang(Logic.nhanKy("quy", dau, cuoi), "Quý 3/2026");
});
test("nhãn năm", () => {
  const { dau, cuoi } = Logic.khoangKy("nam", 0, N("2026-08-12"));
  bang(Logic.nhanKy("nam", dau, cuoi), "Năm 2026");
});

// ===================================================================
nhom("Phân biệt khoản thu và khoản chi");

test("type Thu là khoản thu", () => bang(Logic.laKhoanThu({ type: "Thu" }), true));
test("type Chi là khoản chi", () => bang(Logic.laKhoanThu({ type: "Chi" }), false));
test("DỮ LIỆU CŨ không có type thì tính là chi", () => bang(Logic.laKhoanThu({}), false));
test("type rỗng tính là chi", () => bang(Logic.laKhoanThu({ type: "" }), false));

// ===================================================================
nhom("Gộp số liệu một kỳ");

const MAU = [
  { date: "2026-08-01", amount: 100000, category: "Ăn uống",     payer: "Chương", type: "Chi" },
  { date: "2026-08-15", amount: 250000, category: "Đi lại",      payer: "Thư",    type: "Chi" },
  { date: "2026-08-15", amount:  50000, category: "Ăn uống",     payer: "Chương", type: "Chi" },
  { date: "2026-08-20", amount: 9000000, category: "Lương",      payer: "Chương", type: "Thu" },
  { date: "2026-08-31", amount:  30000, category: "Chợ/Siêu thị", payer: "Thư"                 }, // cũ, không có type
  { date: "2026-09-01", amount: 999999, category: "Ăn uống",     payer: "Chương", type: "Chi" }  // ngoài kỳ
];
const NGUOI = ["Chương", "Thư"];
const gop = Logic.tongHopKy(MAU, "2026-08-01", "2026-08-31", NGUOI);

test("chỉ lấy khoản nằm trong kỳ", () => bang(gop.soKhoan, 5));
test("tổng thu", () => bang(gop.tongThu, 9000000));
test("tổng chi (gồm cả dòng cũ thiếu type)", () => bang(gop.tongChi, 430000));
test("còn lại = thu − chi", () => bang(gop.conLai, 8570000));

test("MỐC ĐẦU KỲ được tính vào (01/08)", () => {
  const r = Logic.tongHopKy(MAU, "2026-08-01", "2026-08-01", NGUOI);
  bang(r.tongChi, 100000);
});
test("MỐC CUỐI KỲ được tính vào (31/08)", () => {
  const r = Logic.tongHopKy(MAU, "2026-08-31", "2026-08-31", NGUOI);
  bang(r.tongChi, 30000);
});
test("khoản ngoài kỳ bị loại", () => {
  const r = Logic.tongHopKy(MAU, "2026-09-01", "2026-09-30", NGUOI);
  bang([r.tongChi, r.soKhoan], [999999, 1]);
});

test("gộp theo danh mục, xếp từ lớn xuống nhỏ", () => {
  bang(gop.theoDanhMuc, [
    { ten: "Đi lại", tien: 250000 },
    { ten: "Ăn uống", tien: 150000 },
    { ten: "Chợ/Siêu thị", tien: 30000 }
  ]);
});

test("danh mục KHÔNG lẫn khoản thu", () => {
  bang(gop.theoDanhMuc.some(d => d.ten === "Lương"), false);
});

test("gộp theo người, chỉ tính khoản chi", () => {
  bang(gop.theoNguoi, [
    { ten: "Thư", tien: 280000 },
    { ten: "Chương", tien: 150000 }
  ]);
});

test("người không chi gì thì không hiện", () => {
  const r = Logic.tongHopKy(MAU, "2026-08-01", "2026-08-01", NGUOI);
  bang(r.theoNguoi, [{ ten: "Chương", tien: 100000 }]);
});

test("kỳ rỗng trả về số 0, không lỗi", () => {
  const r = Logic.tongHopKy(MAU, "2020-01-01", "2020-01-31", NGUOI);
  bang([r.soKhoan, r.tongThu, r.tongChi, r.conLai, r.theoDanhMuc, r.theoNguoi],
       [0, 0, 0, 0, [], []]);
});

test("danh sách rỗng không làm vỡ", () => {
  const r = Logic.tongHopKy([], "2026-08-01", "2026-08-31", NGUOI);
  bang(r.tongChi, 0);
});

test("chi nhiều hơn thu thì còn lại âm", () => {
  const r = Logic.tongHopKy([
    { date: "2026-08-05", amount: 500000, category: "Ăn uống", payer: "Thư", type: "Chi" },
    { date: "2026-08-06", amount: 200000, category: "Lương",   payer: "Thư", type: "Thu" }
  ], "2026-08-01", "2026-08-31", NGUOI);
  bang(r.conLai, -300000);
});

test("khoản thiếu danh mục xếp vào Khác", () => {
  const r = Logic.tongHopKy([
    { date: "2026-08-05", amount: 1000, payer: "Thư", type: "Chi" }
  ], "2026-08-01", "2026-08-31", NGUOI);
  bang(r.theoDanhMuc, [{ ten: "Khác", tien: 1000 }]);
});

test("số tiền dạng chuỗi vẫn cộng đúng", () => {
  const r = Logic.tongHopKy([
    { date: "2026-08-05", amount: "1000", category: "Ăn uống", payer: "Thư", type: "Chi" }
  ], "2026-08-01", "2026-08-31", NGUOI);
  bang(r.tongChi, 1000);
});

// ===================================================================
nhom("Bốn lọ — chia khoản thu");

test("chia đúng tỉ lệ chuẩn 45/25/20/10", () => {
  const r = Logic.phanBo(20000000, Logic.tiLeMacDinh());
  bang([r.NEC, r.PLAY, r.SAVE, r.EDU],
       [9000000, 5000000, 4000000, 2000000]);
});

test("chỉ còn đúng bốn lọ, không sót lọ cũ của sổ gia đình", () => {
  const r = Logic.phanBo(1000000, Logic.tiLeMacDinh());
  bang(Object.keys(r).sort().join(","), "EDU,NEC,PLAY,SAVE");
});

test("TỔNG CÁC LỌ LUÔN BẰNG SỐ TIỀN GỐC (số lẻ)", () => {
  const tien = 12345679;
  const r = Logic.phanBo(tien, Logic.tiLeMacDinh());
  const tong = Object.keys(r).reduce((s, k) => s + r[k], 0);
  bang(tong, tien, "phần lẻ bị rơi mất");
});

test("tổng vẫn khớp với tỉ lệ tự đặt", () => {
  const ty = { NEC: 50, PLAY: 20, SAVE: 25, EDU: 5 };
  const tien = 7777777;
  const r = Logic.phanBo(tien, ty);
  bang(Object.keys(r).reduce((s, k) => s + r[k], 0), tien);
});

test("tiền 0 thì mọi lọ đều 0", () => {
  const r = Logic.phanBo(0, Logic.tiLeMacDinh());
  bang(r.NEC, 0);
});

test("bảng phân bổ đã lưu được ưu tiên hơn tỉ lệ hiện tại", () => {
  const khoanThu = { amount: 1000000, type: "Thu", alloc: { NEC: 1000000, PLAY: 0, SAVE: 0, EDU: 0 } };
  const r = Logic.phanBoCuaKhoanThu(khoanThu, Logic.tiLeMacDinh());
  bang(r.NEC, 1000000, "đổi tỉ lệ không được làm sai lịch sử");
});

// ===================================================================
nhom("Bốn lọ — đoán lọ từ danh mục");

test("Ăn uống vào Thiết yếu", () => bang(Logic.doanLo("Ăn uống"), "NEC"));
test("Cà phê/Nhậu vào Hưởng thụ", () => bang(Logic.doanLo("Cà phê/Nhậu"), "PLAY"));
test("Thể thao vào Hưởng thụ", () => bang(Logic.doanLo("Thể thao"), "PLAY"));
test("Điện thoại/Internet vào Thiết yếu", () => bang(Logic.doanLo("Điện thoại/Internet"), "NEC"));
test("Học tập vào lọ Học tập", () => bang(Logic.doanLo("Học tập"), "EDU"));
test("danh mục lạ rơi vào Thiết yếu", () => bang(Logic.doanLo("Linh tinh"), "NEC"));

// Sổ gia đình có thể đã ghi các danh mục này; nếu đoán ra lọ đã bị bỏ thì
// số dư sẽ rơi vào hư không mà không báo lỗi.
test("danh mục cũ của sổ gia đình vẫn đoán ra lọ đang tồn tại", () => {
  const conSong = ["NEC", "PLAY", "SAVE", "EDU"];
  ["Chợ/Siêu thị", "Hoá đơn", "Đồ dùng gia đình", "Biếu tặng", "Từ thiện", "Đầu tư"]
    .forEach(dm => {
      const lo = Logic.doanLo(dm);
      if (!conSong.includes(lo)) throw new Error(`"${dm}" đoán ra lọ "${lo}" không còn tồn tại`);
    });
  bang(true, true);
});

// ===================================================================
nhom("Bốn lọ — số dư");

const TY = Logic.tiLeMacDinh();
const SO = [
  { id: "t1", date: "2026-08-01", amount: 20000000, type: "Thu", category: "Lương" },
  { id: "c1", date: "2026-08-05", amount: 3000000, type: "Chi", jar: "NEC", category: "Ăn uống" },
  { id: "c2", date: "2026-08-06", amount:  500000, type: "Chi", jar: "PLAY", category: "Cà phê/Nhậu" }
];

test("lọ nhận tiền từ khoản thu", () => {
  bang(Logic.soDuCacLo(SO, "2026-08", TY).NEC.vao, 9000000);
});
test("khoản chi trừ đúng lọ", () => {
  const r = Logic.soDuCacLo(SO, "2026-08", TY);
  bang([r.NEC.con, r.PLAY.con], [6000000, 4500000]);
});
test("lọ không liên quan giữ nguyên", () => {
  bang(Logic.soDuCacLo(SO, "2026-08", TY).EDU.con, 2000000);
});

test("khoản chi thiếu cột lọ thì suy từ danh mục", () => {
  const ds = [{ id: "x", date: "2026-08-05", amount: 100000, type: "Chi", category: "Giải trí" }];
  bang(Logic.soDuCacLo(ds, "2026-08", TY).PLAY.ra, 100000);
});

test("LỌ CỘNG DỒN giữ tiền qua tháng", () => {
  const ds = [{ id: "t", date: "2026-07-01", amount: 10000000, type: "Thu" }];
  bang(Logic.soDuCacLo(ds, "2026-08", TY).SAVE.con, 2000000, "tiền tiết kiệm tháng 7 phải còn ở tháng 8");
});

test("LỌ THEO THÁNG không mang tiền tháng trước sang", () => {
  const ds = [{ id: "t", date: "2026-07-01", amount: 10000000, type: "Thu" }];
  bang(Logic.soDuCacLo(ds, "2026-08", TY).NEC.con, 0, "lọ Thiết yếu phải bắt đầu lại mỗi tháng");
});

// ===================================================================
nhom("Bốn lọ — chuyển tiền giữa các lọ");

const CHUYEN = SO.concat([
  { id: "m1", date: "2026-08-20", amount: 1000000, type: "Chuyển", jar: "NEC", jarTo: "SAVE" }
]);

// NEC: 45% của 20tr = 9tr, chi 3tr, chuyển đi 1tr -> còn 5tr
// SAVE: 20% của 20tr = 4tr, nhận thêm 1tr -> còn 5tr
test("lọ nguồn bị trừ", () => {
  bang(Logic.soDuCacLo(CHUYEN, "2026-08", TY).NEC.con, 5000000);
});
test("lọ đích được cộng", () => {
  bang(Logic.soDuCacLo(CHUYEN, "2026-08", TY).SAVE.con, 5000000);
});
test("tổng tiền toàn bộ các lọ KHÔNG đổi sau khi chuyển", () => {
  const truoc = Logic.soDuCacLo(SO, "2026-08", TY);
  const sau = Logic.soDuCacLo(CHUYEN, "2026-08", TY);
  const cong = r => Object.keys(r).reduce((s, k) => s + r[k].con, 0);
  bang(cong(sau), cong(truoc), "chuyển lọ không được làm sinh ra hay mất tiền");
});

test("CHUYỂN LỌ KHÔNG BỊ TÍNH LÀ KHOẢN CHI", () => {
  const r = Logic.tongHopKy(CHUYEN, "2026-08-01", "2026-08-31", ["Chương"]);
  bang(r.tongChi, 3500000, "lệnh chuyển bị cộng nhầm vào tổng chi");
});
test("chuyển lọ cũng không bị tính là khoản thu", () => {
  const r = Logic.tongHopKy(CHUYEN, "2026-08-01", "2026-08-31", ["Chương"]);
  bang(r.tongThu, 20000000);
});
test("chuyển lọ không hiện trong bảng chi theo danh mục", () => {
  const r = Logic.tongHopKy(CHUYEN, "2026-08-01", "2026-08-31", ["Chương"]);
  bang(r.theoDanhMuc.some(d => d.ten === "Chuyển lọ"), false);
});

// ===================================================================
nhom("Bốn lọ — tự động dồn dư cuối tháng");

// NEC nhận 45% của 20tr = 9tr, tiêu 8tr -> dư đúng 1tr để kiểm tra việc dồn dư.
const THANG_TRUOC = [
  { id: "t7", date: "2026-07-01", amount: 20000000, type: "Thu" },

// Hiển thị kết quả
(function veKetQua() {
  const dat = ketQua.filter(k => k.dat).length;
  const hong = ketQua.length - dat;

  const oTong = document.getElementById("tong");
  oTong.className = "tong " + (hong === 0 ? "dat" : "hong");
  oTong.textContent = hong === 0
    ? `✓ ĐẠT TẤT CẢ — ${dat}/${ketQua.length} phép thử`
    : `✕ HỎNG ${hong} — đạt ${dat}/${ketQua.length}`;

  const cacNhom = [];
  ketQua.forEach(k => {
    let n = cacNhom.find(x => x.ten === k.nhom);
    if (!n) { n = { ten: k.nhom, ds: [] }; cacNhom.push(n); }
    n.ds.push(k);
  });

  document.getElementById("kq").innerHTML = cacNhom.map(n => `
    <div class="nhom">
      <h2>${n.ten}</h2>
      ${n.ds.map(k => `
        <div class="ca">
          <span class="${k.dat ? "ok" : "no"}">${k.dat ? "✓" : "✕"}</span>
          ${k.ten}
          ${k.dat ? "" : `<div class="chitiet">${k.loi}</div>`}
        </div>`).join("")}
    </div>`).join("");
})();

}  // hết chayToanBo
